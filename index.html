<script type="module">
import * as THREE from 'three';

// ---------- tuning ----------
const T = {
  N: 24,            // pegs around the rim (tick marks)
  K: 1.6,           // swipe-to-spin strength
  fricA: 0.6,       // steady friction (rad/s²): the long slow crawl at the end
  fricB: 0.18,      // speed friction (per s): drag when spinning fast
  fricC: 0.02,     // extra drag only at very high speed: shortens the longest spins, leaves weak ones alone
  peg: 2.5,         // peg catch strength: rocks back near the end
  maxOmega: 45,     // rad/s cap (~430 rpm)
  coupling: 14,     // how quickly the spinner catches up with a moving finger (per s)
  minLever: 0.3,    // a swipe through the middle still pushes the arrow
};
const STEP = Math.PI * 2 / T.N;

// ---------- renderer ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
const DPR = Math.min(window.devicePixelRatio || 1, 3);
renderer.setPixelRatio(DPR);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.05;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.prepend(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const scene = new THREE.Scene();
const pmrem = new THREE.PMREMGenerator(renderer);
// a dark studio with a few softboxes off to the sides: chrome and lacquer pick up crisp highlights
// that sweep across the needle as it turns, while the dial (seen straight down) keeps its colour
function studio() {
  const s = new THREE.Scene();
  s.background = new THREE.Color(0x050506);
  const box = (w, h, pos, col, k) => {
    const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color: new THREE.Color(col).multiplyScalar(k), side: THREE.DoubleSide }));
    m.position.set(...pos); m.lookAt(0, 0, 0); s.add(m);
  };
  box(5, 2.2, [-5, 4.5, -3], 0xffffff, 5);     // main softbox, upper left
  box(1.6, 5, [5, 3, 1], 0xfff0dd, 2.6);       // warm strip, right
  box(4, 1, [0, 2.5, 6], 0xdfe8ff, 1.4);       // cool fill, bottom edge
  box(14, 14, [0, 9, 0], 0x6c6f78, 1);         // soft grey ceiling
  box(3, 3, [1.5, 7, -1.5], 0xffffff, 3.5);    // small overhead softbox: sparkle on chrome
  return s;
}
scene.environment = pmrem.fromScene(studio(), 0.02).texture;
scene.environmentIntensity = 1.0;

const camera = new THREE.PerspectiveCamera(26, 1, 0.1, 50);
camera.up.set(0, 0, -1);

// ---------- lights ----------
const key = new THREE.DirectionalLight(0xfff3e4, 2.2);
key.position.set(-1.6, 6, -2.2);
key.castShadow = true;
key.shadow.mapSize.set(2048, 2048);
Object.assign(key.shadow.camera, { left: -1.7, right: 1.7, top: 1.7, bottom: -1.7, near: 1, far: 12 });
key.shadow.bias = -0.0004;
key.shadow.normalBias = 0.015;
scene.add(key);
scene.add(new THREE.HemisphereLight(0xdfe6ff, 0x1a120c, 0.35));

// ---------- helpers ----------
function canvasTex(cv) {
  const t = new THREE.CanvasTexture(cv);
  t.colorSpace = THREE.SRGBColorSpace;
  t.anisotropy = maxAniso;
  return t;
}
function shade(hex, f) { // f > 0 lighter, f < 0 darker
  const n = parseInt(hex.slice(1), 16);
  let r = n >> 16, g = (n >> 8) & 255, b = n & 255;
  const m = f > 0 ? 255 : 0, a = Math.abs(f);
  r = Math.round(r + (m - r) * a); g = Math.round(g + (m - g) * a); b = Math.round(b + (m - b) * a);
  return `rgb(${r},${g},${b})`;
}

// ---------- table ----------
function tableTexture() {
  const S = 1024, cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d');
  g.fillStyle = '#1d1915'; g.fillRect(0, 0, S, S);
  const id = g.getImageData(0, 0, S, S), d = id.data;
  for (let i = 0; i < d.length; i += 4) {
    const n = (Math.random() - 0.5) * 14;
    d[i] += n; d[i + 1] += n; d[i + 2] += n;
  }
  g.putImageData(id, 0, 0);
  const t = canvasTex(cv); t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(5, 5);
  return t;
}
const table = new THREE.Mesh(new THREE.PlaneGeometry(14, 14),
  new THREE.MeshStandardMaterial({ map: tableTexture(), roughness: 0.92, metalness: 0 }));
table.rotation.x = -Math.PI / 2; table.position.y = -0.045; table.receiveShadow = true;
scene.add(table);

// ---------- dial ----------
const SEG_COLS = ['#ff4757', '#ff9f1c', '#ffd23f', '#2ed573', '#1e90ff', '#9b59ff'];
function dialTexture(S) {
  const cv = document.createElement('canvas'); cv.width = cv.height = S;
  const g = cv.getContext('2d'), k = S / 2;
  g.translate(k, k);
  const phi = th => th - Math.PI / 2;          // our angle (clockwise from up) -> canvas angle
  const circle = (r) => { g.beginPath(); g.arc(0, 0, r * k, 0, Math.PI * 2); };

  // base
  let gr = g.createRadialGradient(0, -0.15 * k, 0.05 * k, 0, 0, k);
  gr.addColorStop(0, '#2f3b63'); gr.addColorStop(0.55, '#1b2343'); gr.addColorStop(1, '#0c1024');
  circle(1); g.fillStyle = gr; g.fill();

  // engraved sunburst in the centre
  g.save(); g.lineWidth = S / 1500;
  for (let i = 0; i < 180; i++) {
    const a = i / 180 * Math.PI * 2;
    g.strokeStyle = i % 2 ? 'rgba(255,255,255,0.035)' : 'rgba(255,255,255,0.06)';
    g.beginPath(); g.moveTo(Math.cos(a) * 0.13 * k, Math.sin(a) * 0.13 * k);
    g.lineTo(Math.cos(a) * 0.585 * k, Math.sin(a) * 0.585 * k); g.stroke();
  }
  for (const r of [0.2, 0.36, 0.5]) { circle(r); g.strokeStyle = 'rgba(255,255,255,0.07)'; g.stroke(); }
  g.restore();

  // coloured segments
  const n = 12;
  for (let i = 0; i < n; i++) {
    const a0 = i / n * Math.PI * 2, a1 = (i + 1) / n * Math.PI * 2, col = SEG_COLS[i % SEG_COLS.length];
    const sg = g.createRadialGradient(0, 0, 0.6 * k, 0, 0, 0.86 * k);
    sg.addColorStop(0, shade(col, -0.35)); sg.addColorStop(0.55, col); sg.addColorStop(1, shade(col, 0.18));
    g.beginPath(); g.arc(0, 0, 0.86 * k, phi(a0), phi(a1)); g.arc(0, 0, 0.6 * k, phi(a1), phi(a0), true);
    g.closePath(); g.fillStyle = sg; g.fill();
  }
  // gold separators and rings
  const gold = '#e8c27a';
  g.strokeStyle = gold; g.lineWidth = S / 420;
  for (let i = 0; i < n; i++) {
    const a = i / n * Math.PI * 2;
    g.beginPath(); g.moveTo(Math.sin(a) * 0.6 * k, -Math.cos(a) * 0.6 * k);
    g.lineTo(Math.sin(a) * 0.86 * k, -Math.cos(a) * 0.86 * k); g.stroke();
  }
  for (const r of [0.6, 0.86]) { circle(r); g.lineWidth = S / 300; g.stroke(); }

  // outer band with ticks
  g.beginPath(); g.arc(0, 0, 0.995 * k, 0, Math.PI * 2); g.arc(0, 0, 0.865 * k, 0, Math.PI * 2, true);
  g.fillStyle = '#0d1126'; g.fill();
  for (let i = 0; i < 96; i++) {
    const a = i / 96 * Math.PI * 2, major = i % 4 === 0;
    g.strokeStyle = major ? 'rgba(232,194,122,0.0)' : 'rgba(232,194,122,0.45)';
    g.lineWidth = S / 900;
    const r0 = 0.875, r1 = 0.895;
    g.beginPath(); g.moveTo(Math.sin(a) * r0 * k, -Math.cos(a) * r0 * k);
    g.lineTo(Math.sin(a) * r1 * k, -Math.cos(a) * r1 * k); g.stroke();
  }
  circle(0.975); g.strokeStyle = 'rgba(232,194,122,0.5)'; g.lineWidth = S / 700; g.stroke();
  return cv;
}

const dial = new THREE.Group(); scene.add(dial);
const lacquer = new THREE.MeshPhysicalMaterial({ color: 0x0d1126, roughness: 0.35, clearcoat: 1, clearcoatRoughness: 0.1 });
const body = new THREE.Mesh(new THREE.CylinderGeometry(1, 1, 0.08, 192, 1, true), lacquer);
body.castShadow = true; dial.add(body);
const faceTexSize = Math.min(4096, renderer.capabilities.maxTextureSize, 2048 * (DPR >= 2 ? 2 : 1));
const face = new THREE.Mesh(new THREE.CircleGeometry(1, 192), new THREE.MeshPhysicalMaterial({
  map: canvasTex(dialTexture(faceTexSize)), roughness: 0.42, metalness: 0.05, clearcoat: 1, clearcoatRoughness: 0.06,
}));
face.rotation.x = -Math.PI / 2; face.position.y = 0.04; face.receiveShadow = true; dial.add(face);

const chrome = new THREE.MeshPhysicalMaterial({ color: 0xe6e6ea, metalness: 1, roughness: 0.14 });
const goldMat = new THREE.MeshPhysicalMaterial({ color: 0xe2b766, metalness: 1, roughness: 0.22 });
const rim = new THREE.Mesh(new THREE.TorusGeometry(1.0, 0.035, 32, 256), chrome);
rim.rotation.x = Math.PI / 2; rim.position.y = 0.04; rim.castShadow = true; dial.add(rim);

// pegs (chrome studs) at each tick
const pegGeo = new THREE.CylinderGeometry(0.016, 0.019, 0.05, 32);
const pegCapGeo = new THREE.SphereGeometry(0.016, 24, 12, 0, Math.PI * 2, 0, Math.PI / 2);
for (let i = 0; i < T.N; i++) {
  const a = i * STEP, r = 0.93;
  const x = Math.sin(a) * r, z = -Math.cos(a) * r;
  const p = new THREE.Mesh(pegGeo, chrome); p.position.set(x, 0.065, z); p.castShadow = true; dial.add(p);
  const c = new THREE.Mesh(pegCapGeo, chrome); c.position.set(x, 0.09, z); c.castShadow = true; dial.add(c);
}

// ---------- arrow (compass-style needle) ----------
function needleShapes() {
  const front = new THREE.Shape();
  front.moveTo(0, 0.83);
  front.quadraticCurveTo(0.028, 0.42, 0.078, 0.0);
  front.lineTo(-0.078, 0.0);
  front.quadraticCurveTo(-0.028, 0.42, 0, 0.83);
  return { front };
}
const ext = { depth: 0.022, bevelEnabled: true, bevelThickness: 0.012, bevelSize: 0.011, bevelSegments: 6, curveSegments: 48 };
const { front } = needleShapes();
const frontGeo = new THREE.ExtrudeGeometry(front, ext);
const redMat = new THREE.MeshPhysicalMaterial({ color: 0xff2a3a, roughness: 0.28, clearcoat: 1, clearcoatRoughness: 0.04, sheen: 0.2 });

const arrow = new THREE.Group(); arrow.position.y = 0.075; scene.add(arrow);
const needle = new THREE.Group(); needle.rotation.x = -Math.PI / 2; arrow.add(needle);
const fm = new THREE.Mesh(frontGeo, redMat);
fm.castShadow = true; needle.add(fm);
// hub
const hubBase = new THREE.Mesh(new THREE.CylinderGeometry(0.11, 0.115, 0.03, 96), goldMat);
hubBase.position.y = 0.05; hubBase.castShadow = true; scene.add(hubBase);
const hub = new THREE.Mesh(new THREE.SphereGeometry(0.075, 64, 32, 0, Math.PI * 2, 0, Math.PI / 2), chrome);
hub.scale.y = 0.75; hub.position.y = 0.11; hub.castShadow = true; arrow.add(hub); hub.position.y = 0.035;

// motion-blur ghosts (only visible at speed)
const ghosts = [];
for (let i = 0; i < 5; i++) {
  const gGroup = new THREE.Group(); gGroup.position.y = 0.075;
  const gn = new THREE.Group(); gn.rotation.x = -Math.PI / 2; gGroup.add(gn);
  const gf = new THREE.MeshBasicMaterial({ color: 0xff3344, transparent: true, opacity: 0, depthWrite: false });
  gn.add(new THREE.Mesh(frontGeo, gf));
  scene.add(gGroup); ghosts.push({ g: gGroup, mat: gf });
}

// ---------- layout ----------
const trail = document.getElementById('trail'), tctx = trail.getContext('2d');
let W = 0, H = 0, C = { x: 0, y: 0 }, R = 1;
function layout() {
  W = innerWidth; H = innerHeight;
  renderer.setSize(W, H);
  camera.aspect = W / H;
  const tanH = Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  const D = 1.075 / (Math.min(1, camera.aspect) * tanH) + 0.08;
  camera.position.set(0, D, 0); camera.lookAt(0, 0, 0); camera.updateProjectionMatrix();
  trail.width = W * DPR; trail.height = H * DPR; trail.style.width = W + 'px'; trail.style.height = H + 'px';
  tctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const p0 = new THREE.Vector3(0, 0.075, 0).project(camera), p1 = new THREE.Vector3(1, 0.075, 0).project(camera);
  C = { x: (p0.x + 1) / 2 * W, y: (1 - p0.y) / 2 * H };
  R = (p1.x - p0.x) / 2 * W;
}
addEventListener('resize', layout); layout();

// ---------- audio ----------
let ac = null, noiseBuf = null, master = null;
function initAudio() {
  if (ac) { if (ac.state === 'suspended') ac.resume(); return; }
  ac = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
  master = ac.createGain(); master.gain.value = muted ? 0 : 0.9; master.connect(ac.destination);
  noiseBuf = ac.createBuffer(1, ac.sampleRate, ac.sampleRate);
  const d = noiseBuf.getChannelData(0); for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
function noise(dur) { const s = ac.createBufferSource(); s.buffer = noiseBuf; s.start(ac.currentTime, Math.random() * 0.5, dur + 0.05); return s; }
function tickSound(rate) {
  if (!ac) return;
  const t = ac.currentTime, vol = rate > 40 ? 0.12 : rate > 20 ? 0.2 : 0.32;
  const s = noise(0.04), bp = ac.createBiquadFilter(), gn = ac.createGain();
  bp.type = 'bandpass'; bp.frequency.value = 3200 + Math.random() * 600; bp.Q.value = 2.5;
  gn.gain.setValueAtTime(vol, t); gn.gain.exponentialRampToValueAtTime(0.001, t + 0.028);
  s.connect(bp).connect(gn).connect(master);
  const o = ac.createOscillator(), og = ac.createGain();
  o.type = 'triangle'; o.frequency.value = 1500 + Math.random() * 120;
  og.gain.setValueAtTime(vol * 0.35, t); og.gain.exponentialRampToValueAtTime(0.001, t + 0.02);
  o.connect(og).connect(master); o.start(t); o.stop(t + 0.03);
}
function whoosh(power) {
  if (!ac) return;
  const t = ac.currentTime, s = noise(0.5), bp = ac.createBiquadFilter(), gn = ac.createGain();
  bp.type = 'bandpass'; bp.Q.value = 1.2;
  bp.frequency.setValueAtTime(500, t); bp.frequency.exponentialRampToValueAtTime(1800 + power * 1500, t + 0.12);
  bp.frequency.exponentialRampToValueAtTime(500, t + 0.45);
  gn.gain.setValueAtTime(0.0001, t); gn.gain.exponentialRampToValueAtTime(0.25 * power + 0.02, t + 0.06);
  gn.gain.exponentialRampToValueAtTime(0.001, t + 0.45);
  s.connect(bp).connect(gn).connect(master);
}
function chime() {
  if (!ac) return;
  const t = ac.currentTime;
  [[1318.5, 0], [1975.5, 0.09]].forEach(([f, dt]) => {
    const o = ac.createOscillator(), g = ac.createGain();
    o.type = 'sine'; o.frequency.value = f;
    g.gain.setValueAtTime(0.0001, t + dt); g.gain.exponentialRampToValueAtTime(0.18, t + dt + 0.01);
    g.gain.exponentialRampToValueAtTime(0.001, t + dt + 0.9);
    o.connect(g).connect(master); o.start(t + dt); o.stop(t + dt + 1);
  });
}
const muteBtn = document.getElementById('mute');
let muted = true;
muteBtn.addEventListener('click', () => {
  muted = !muted;
  muteBtn.classList.toggle('muted', muted);
  if (master) master.gain.value = muted ? 0 : 0.9;
});
let lastVib = 0;
function buzz(ms) { if (navigator.vibrate) navigator.vibrate(ms); }

// ---------- physics ----------
let theta = (Math.random() * T.N | 0) * STEP + STEP / 2, omega = 0, moving = false;
let fricA = T.fricA, spinStart = 0, turnsAtStart = 0, lastPeg = Math.floor(theta / STEP);
const stats = { speed: 0, lever: 0, w0: 0, time: 0, turns: 0, stopDeg: null };

function step(dt) {
  if (!moving) return;
  const pegT = -T.peg * Math.sin(T.N * (theta - STEP / 2));
  if (Math.abs(omega) < 0.03 && Math.abs(pegT) <= fricA) { omega = 0; moving = false; onStop(); return; }
  const dir = omega !== 0 ? Math.sign(omega) : Math.sign(pegT);
  const acc = pegT - dir * (fricA + T.fricB * Math.abs(omega) + T.fricC * omega * omega);
  const next = omega + acc * dt;
  omega = (omega !== 0 && Math.sign(next) !== Math.sign(omega)) ? 0 : next;
  theta += omega * dt;
  const peg = Math.floor(theta / STEP);
  if (peg !== lastPeg) {
    lastPeg = peg;
    const rate = Math.abs(omega) / STEP;
    tickSound(rate);
    const now = performance.now();
    if (now - lastVib > 30) { buzz(rate > 25 ? 3 : 6); lastVib = now; }
  }
}
function onStop() {
  stats.time = (performance.now() - spinStart) / 1000;
  stats.turns = Math.abs(theta - turnsAtStart) / (Math.PI * 2);
  stats.stopDeg = ((theta * 180 / Math.PI) % 360 + 360) % 360;
  chime(); buzz(25);
  showHud();
}

// ---------- input ----------
let finger = null; // { id, pts: [{x,y,t}] }
let trailPts = [], leverLine = null, leverFade = 0;
const msg = document.getElementById('msg');
function flash(text) { msg.textContent = text; msg.style.opacity = 1; clearTimeout(flash.t); flash.t = setTimeout(() => msg.style.opacity = 0, 1100); }

function fitVelocity(pts, windowMs) {
  const tEnd = pts[pts.length - 1].t;
  const w = pts.filter(p => tEnd - p.t <= windowMs);
  if (w.length < 2) return { vx: 0, vy: 0 };
  let st = 0, sx = 0, sy = 0, stt = 0, stx = 0, sty = 0; const n = w.length;
  for (const p of w) { const t = (p.t - tEnd) / 1000; st += t; sx += p.x; sy += p.y; stt += t * t; stx += t * p.x; sty += t * p.y; }
  const den = n * stt - st * st;
  if (Math.abs(den) < 1e-12) return { vx: 0, vy: 0 };
  return { vx: (n * stx - st * sx) / den, vy: (n * sty - st * sy) / den };
}

// spin that a straight swipe with this velocity, through this point, would give
// mouse only: a mouse slows before the button comes up, so use the fastest moment of the recent drag
const MOUSE_GAIN = 2;
function peakVelocity(pts) {
  const tEnd = pts[pts.length - 1].t;
  let best = { vx: 0, vy: 0, x: pts[pts.length - 1].x, y: pts[pts.length - 1].y }, top = 0;
  for (let i = pts.length - 1; i > 0 && tEnd - pts[i].t <= 250; i--) {
    const v = fitVelocity(pts.slice(0, i + 1), 50), s = Math.hypot(v.vx, v.vy);
    if (s > top) { top = s; best = { ...v, x: pts[i].x, y: pts[i].y }; }
  }
  return best;
}

function targetOmega(px, py, vx, vy, gain = 1) {
  const speed = Math.hypot(vx, vy);
  if (speed < 1) return { w: 0, lever: 0, speed };
  const ux = vx / speed, uy = vy / speed;
  const rx = px - C.x, ry = py - C.y;
  let s = (rx * uy - ry * ux) / R;              // signed distance of the swipe line from the centre, in dial radii
  let lever = Math.min(1, Math.abs(s));
  let sign = Math.sign(s);
  if (Math.abs(s) < 0.12) {                       // straight through the middle: it pushes the needle tip
    const nx = Math.sin(theta), ny = -Math.cos(theta);
    const c = nx * uy - ny * ux;
    sign = Math.abs(c) > 0.15 ? Math.sign(c) : (Math.sign(s) || 1);
  }
  lever = Math.max(T.minLever, lever);
  const w = sign * Math.min(T.maxOmega, T.K * lever * speed * gain / R);
  return { w, lever, speed };
}

function addPoints(e) {
  const evs = e.getCoalescedEvents ? e.getCoalescedEvents() : [];
  const list = evs.length ? evs : [e];
  for (const ev of list) {
    finger.pts.push({ x: ev.clientX, y: ev.clientY, t: ev.timeStamp });
    trailPts.push({ x: ev.clientX, y: ev.clientY, t: performance.now() });
  }
  if (finger.pts.length > 400) finger.pts.splice(0, finger.pts.length - 400);
}

addEventListener('pointerdown', e => {
  if (!started || e.target.id === 'hudBtn' || e.target.id === 'mute') return;
  const mouse = e.pointerType === 'mouse';
  if (mouse) {
    if (e.button !== 0) return;
    finger = null;                                  // a lost button-up can never jam the mouse
    try { document.documentElement.setPointerCapture(e.pointerId); } catch {}   // keeps working outside the window
  }
  if (finger) return;
  finger = { id: e.pointerId, pts: [] , pushed: false, mouse };
  trailPts = [];
  addPoints(e);
}, { passive: true });

addEventListener('pointermove', e => {
  if (!finger || e.pointerId !== finger.id) return;
  addPoints(e);
  // live push: the spinner picks up speed while the finger is still moving
  const last = finger.pts[finger.pts.length - 1];
  const { vx, vy } = fitVelocity(finger.pts, 40);
  const { w } = targetOmega(last.x, last.y, vx, vy, finger.mouse ? MOUSE_GAIN : 1);
  if (Math.abs(w) > 0.6) {
    const faster = Math.abs(w) > Math.abs(omega) || Math.sign(w) !== Math.sign(omega);
    if (faster) {
      if (!moving || !finger.pushed) { spinStart = performance.now(); turnsAtStart = theta; }
      const dt = Math.min(0.05, (finger.lastPush ? e.timeStamp - finger.lastPush : 16) / 1000);
      omega += (w - omega) * Math.min(1, dt * T.coupling);
      moving = true; finger.pushed = true;
    }
  }
  finger.lastPush = e.timeStamp;
}, { passive: true });

function endFinger(e, cancelled) {
  if (!finger || e.pointerId !== finger.id) return;
  if (!cancelled) addPoints(e);
  const pts = finger.pts, a = pts[0], b = pts[pts.length - 1];
  const travel = Math.hypot(b.x - a.x, b.y - a.y);
  if (!cancelled && travel <= 10 && b.t - a.t < 300) checkDoubleTap(b);
  if (!cancelled && travel > 10) {
    const rel = finger.mouse ? peakVelocity(pts) : { ...fitVelocity(pts, 70), x: b.x, y: b.y };
    const { vx, vy } = rel;
    const { w, lever, speed } = targetOmega(rel.x, rel.y, vx, vy, finger.mouse ? MOUSE_GAIN : 1);
    if ((w !== 0 || !finger.mouse) && (Math.abs(w) > Math.abs(omega) || Math.sign(w) !== Math.sign(omega))) omega = w;
    if (!finger.pushed) { spinStart = performance.now(); turnsAtStart = theta; }
    stats.speed = speed; stats.lever = lever; stats.w0 = omega; stats.stopDeg = null;
    fricA = T.fricA * (0.88 + Math.random() * 0.24);   // small hidden randomness: no "perfect swipe"
    if (Math.abs(omega) > 0.05) moving = true;
    whoosh(Math.min(1, Math.abs(omega) / 25));
    if (speed < 250) flash('Swipe faster');
    // show the swipe line and its distance from the centre
    if (speed > 1) {
      const ux = vx / speed, uy = vy / speed, rx = b.x - C.x, ry = b.y - C.y, d = rx * ux + ry * uy;
      leverLine = { fx: b.x - d * ux, fy: b.y - d * uy, ux, uy };
      leverFade = 1;
    }
    showHud();
  }
  finger = null;
}
// double tap anywhere: full screen on / off
let lastTap = null;
async function enterFullscreen() {
  const el = document.documentElement;
  try { if (el.requestFullscreen) await el.requestFullscreen({ navigationUI: 'hide' }); } catch {}
  try { await screen.orientation.lock('portrait'); } catch {}
}
function checkDoubleTap(p) {
  if (Math.hypot(p.x - C.x, p.y - C.y) < R * 1.06) { lastTap = null; return; }   // on the wheel: ignore
  if (lastTap && p.t - lastTap.t < 350 && Math.hypot(p.x - lastTap.x, p.y - lastTap.y) < 50) {
    lastTap = null;
    if (document.fullscreenElement) document.exitFullscreen().catch(() => {});
    else enterFullscreen();
  } else lastTap = p;
}
addEventListener('pointerup', e => endFinger(e, false), { passive: true });
addEventListener('pointercancel', e => endFinger(e, true), { passive: true });
addEventListener('contextmenu', e => e.preventDefault());

// ---------- HUD ----------
const hud = document.getElementById('hud'), hudBtn = document.getElementById('hudBtn');
let hudOn = true; try { hudOn = localStorage.getItem('spin.hud') !== '0'; } catch {}
hudBtn.addEventListener('click', () => { hudOn = !hudOn; try { localStorage.setItem('spin.hud', hudOn ? '1' : '0'); } catch {} showHud(); });
let fps = 0;
function showHud() {
  hud.style.display = hudOn ? '' : 'none';
  if (!hudOn) return;
  const rpm = Math.abs(stats.w0) * 60 / (Math.PI * 2);
  hud.textContent =
    `${Math.round(fps)} fps · ${W}×${H} @${DPR.toFixed(2)}x\n` +
    `Swipe ${Math.round(stats.speed).toLocaleString()} px/s · lever ${Math.round(stats.lever * 100)}%\n` +
    `Start ${Math.round(rpm)} rpm ${stats.w0 > 0 ? '↻' : stats.w0 < 0 ? '↺' : ''}\n` +
    (stats.stopDeg != null ? `Spun ${stats.time.toFixed(1)} s · ${stats.turns.toFixed(1)} turns · stopped ${stats.stopDeg.toFixed(1)}°` : moving ? 'Spinning…' : '');
}

// ---------- start (full screen, sound unlock) ----------
let started = false;
document.getElementById('start').addEventListener('click', async () => {
  initAudio();
  await enterFullscreen();
  try { if (navigator.wakeLock) await navigator.wakeLock.request('screen'); } catch {}
  document.getElementById('start').remove();
  started = true; layout(); showHud();
});

// ---------- draw ----------
function drawTrail(now) {
  tctx.clearRect(0, 0, W, H);
  const live = trailPts.filter(p => now - p.t < 260);
  trailPts = live;
  if (live.length > 1) {
    tctx.lineCap = 'round'; tctx.lineJoin = 'round';
    for (let i = 1; i < live.length; i++) {
      const a = live[i - 1], b = live[i], f = 1 - (now - b.t) / 260;
      tctx.strokeStyle = `rgba(255,255,255,${0.55 * f})`;
      tctx.lineWidth = 2 + 10 * f;
      tctx.beginPath(); tctx.moveTo(a.x, a.y); tctx.lineTo(b.x, b.y); tctx.stroke();
    }
  }
  if (hudOn && leverLine && leverFade > 0) {
    const { fx, fy, ux, uy } = leverLine, L = Math.max(W, H);
    tctx.setLineDash([4, 6]); tctx.lineWidth = 1;
    tctx.strokeStyle = `rgba(255,255,255,${0.35 * leverFade})`;
    tctx.beginPath(); tctx.moveTo(fx - ux * L, fy - uy * L); tctx.lineTo(fx + ux * L, fy + uy * L); tctx.stroke();
    tctx.strokeStyle = `rgba(255,214,120,${0.7 * leverFade})`;
    tctx.beginPath(); tctx.moveTo(C.x, C.y); tctx.lineTo(fx, fy); tctx.stroke();
    tctx.setLineDash([]);
  }
}

let prev = performance.now(), acc = 0, fpsFrames = 0, fpsT = prev, lastHud = 0;
const H_STEP = 1 / 480;
function frame(now) {
  requestAnimationFrame(frame);
  let dt = Math.min(0.05, (now - prev) / 1000); prev = now;
  const before = theta;
  acc += dt;
  while (acc >= H_STEP) { step(H_STEP); acc -= H_STEP; }
  arrow.rotation.y = -theta;
  // motion blur: spread ghosts over the arc travelled this frame
  const arc = theta - before, speed = Math.abs(omega);
  const blur = speed > 6 ? Math.min(1, (speed - 6) / 20) : 0;
  const spread = Math.sign(arc) * Math.min(Math.abs(arc), 0.18);
  ghosts.forEach((gh, i) => {
    const f = (i + 1) / (ghosts.length + 1);
    gh.g.rotation.y = -(theta - spread * f);
    const o = blur * 0.22 * (1 - f * 0.7);
    gh.mat.opacity = o;
    gh.g.visible = o > 0.003;
  });
  // fps
  fpsFrames++;
  if (now - fpsT > 500) { fps = fpsFrames * 1000 / (now - fpsT); fpsFrames = 0; fpsT = now; }
  if (now - lastHud > 250) { lastHud = now; if (moving || hudOn) showHud(); }
  if (leverFade > 0 && !finger) leverFade = Math.max(0, leverFade - dt * 0.35);
  drawTrail(now);
  renderer.render(scene, camera);
}
requestAnimationFrame(frame);
window.__spin = { get theta() { return theta; }, get omega() { return omega; }, get moving() { return moving; }, C: () => C, R: () => R, stats };
</script>
</body>
</html>
